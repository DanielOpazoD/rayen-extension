<!doctype html>
<meta charset="utf-8">
<title>Rayen · dev</title>
<style>#devBadge{position:fixed;left:12px;bottom:12px;z-index:9999;font:600 11px/1 system-ui;letter-spacing:.06em;background:#7d5200;color:#fff;padding:6px 9px;border-radius:4px;opacity:.85;pointer-events:none}</style>
<script type="module">
  // Dev harness: real app.html + real app.js, fake chrome.* and synthetic data.
  // Open via `npm run dev` (or any static server at the repo root) → /dev/
  import { seed, setFichaResponses, setFichaMode, setCitasPorDia, loadCaptures } from './chrome-stub.js';
  import { buildFixture } from './fixture.js';
  import { buildFichaResponses } from './ficha-fixture.js';
  const fixture = buildFixture();
  seed(fixture.storage);
  setCitasPorDia(fixture.citasPorDia);
  setFichaResponses(buildFichaResponses());
  const params = new URLSearchParams(location.search);
  if (params.get('ficha') === 'off') setFichaMode('off');
  // Las capturas se cargan sólo si se piden (?ficha=capturas): así el arnés por
  // defecto no pide un manifiesto que no existe y la consola queda limpia.
  const capturas = params.get('ficha') === 'capturas' ? await loadCaptures() : [];

  const html = await (await fetch('../app.html')).text();
  const doc  = new DOMParser().parseFromString(html, 'text/html');
  doc.querySelectorAll('script').forEach(s => s.remove());
  const appRoot = new URL('../', import.meta.url);
  doc.querySelectorAll('link[href]').forEach(link => {
    link.href = new URL(link.getAttribute('href'), appRoot).href;
  });
  document.title = `${doc.title} · dev`;
  document.head.append(...doc.head.querySelectorAll('style, link, meta[name=viewport]'));
  document.body.innerHTML = doc.body.innerHTML;
  document.body.insertAdjacentHTML('beforeend', `<div id="devBadge">DEV · DATOS SINTÉTICOS${capturas.length ? ` · CAPTURAS: ${capturas.join(', ')}` : ''}${params.get('ficha') === 'off' ? ' · FICHA CAÍDA' : ''}</div>`);

  await import('../app.js');
  document.documentElement.dataset.devReady = 'true';
</script>
