<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light dark">
<title>Rayen Atenciones</title>
<style>
:root{
  color-scheme:light;
  --brand:#1a7f5f;--brand-2:#14614a;--bg:#f7f8f8;--card:#fff;--rule:#e4e7e7;
  --ink:#16191b;--ink-2:#4b5358;--ink-3:#666f74;--ink-4:#98a1a6;
  --good:#0f6b46;--bad:#a02a2a;--warn:#7d5200;
  --t-xs:12px;--t-sm:13px;--t-base:15px;--r-sm:4px;--r-md:8px;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  color-scheme:dark;
  --brand:#4cbb96;--brand-2:#4cbb96;--bg:#131617;--card:#1b1e20;--rule:#2c3134;
  --ink:#e9ecec;--ink-2:#b3bbbe;--ink-3:#8d9599;--ink-4:#666e72;
  --good:#5cc198;--bad:#e88b83;--warn:#d6a94e;
}}
*{box-sizing:border-box;margin:0;padding:0}
body{width:320px;padding:16px;font-family:var(--font);font-size:var(--t-base);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.mark{width:26px;height:26px;border-radius:7px;background:var(--brand);flex-shrink:0;position:relative}
.mark::before,.mark::after{content:'';position:absolute;background:#fff;border-radius:1px}
.mark::before{left:11.5px;top:6px;width:3px;height:14px}
.mark::after{left:6px;top:11.5px;width:14px;height:3px}
h1{font-size:var(--t-base);font-weight:600;letter-spacing:-.01em;line-height:1.2}
.brand p{font-size:var(--t-xs);color:var(--ink-3)}
#status{display:flex;align-items:center;gap:8px;font-size:var(--t-sm);color:var(--ink-2);padding:9px 12px;border-radius:var(--r-md);background:var(--card);border:1px solid var(--rule);margin-bottom:10px;line-height:1.4}
#status::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--ink-4);flex-shrink:0}
#status.ok{color:var(--good)}#status.ok::before{background:var(--good)}
#status.err{color:var(--bad)}#status.err::before{background:var(--bad)}
.btn{display:block;width:100%;padding:9px;border:none;border-radius:var(--r-sm);cursor:pointer;font-size:var(--t-sm);font-weight:600;background:var(--brand);color:#fff}
.btn:hover{background:var(--brand-2)}
.btn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.hint{font-size:var(--t-xs);color:var(--ink-3);margin-top:10px;line-height:1.45}
</style>
</head>
<body>
<div class="brand">
  <span class="mark" aria-hidden="true"></span>
  <div><h1>Rayen Atenciones</h1><p>Hospital Hanga Roa · Dr. Daniel Opazo Damiani</p></div>
</div>
<div id="status" role="status">Verificando sesión…</div>
<button class="btn" id="btnOpen">Abrir en pestaña completa</button>
<p class="hint">Requiere una pestaña de clinicohangaroa.eloisa.cl con sesión iniciada.</p>
<script src="popup-init.js"></script>
</body>
</html>
